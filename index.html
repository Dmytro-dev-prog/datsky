<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Візитівка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <main class="wrap">
    <header class="profile">
      <div class="avatar-ring">
        <div class="avatar-inner">
          <div id="avatar-fallback" class="fallback">ВН</div>
          <img id="avatar" alt="Фото профілю" />
        </div>
      </div>
      <h1 id="name"></h1>
      <p id="handle" class="handle"></p>
      <p id="bio" class="bio"></p>
      <p id="location" class="loc" hidden></p>
    </header>

    <section id="links" class="links" aria-label="Головні посилання"></section>
    <nav id="socials" class="socials" aria-label="Соцмережі"></nav>
    <p id="footer" class="footer"></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
